name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 빠르게 여러 푸시가 들어오면 직전 deploy를 취소하고 최신만 진행.
  # branch별로 그룹을 분리해 main/dev가 서로 cancel되지 않게 한다.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build for Cloudflare Pages
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1ff44f415f8e1035dfbc71bb19300b05
          # commit-message는 ASCII로 sanitize. git commit message에 GitHub Actions
          # expression syntax나 일부 유니코드가 들어가면 Cloudflare Pages API가
          # "Invalid commit message ... must be valid UTF-8" 으로 거부 (8000111).
          command: pages deploy .vercel/output/static --project-name=prism --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-message=${{ github.ref_name }}@${{ github.sha }}

      - name: Notify deploy result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          BRANCH="${{ github.ref_name }}"
          ENV="preview"
          [ "$BRANCH" = "main" ] && ENV="production"
          ICON="✅"
          [ "$STATUS" = "failure" ] && ICON="❌"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"chat_id":"%s","text":"%s <b>Pages Deploy %s</b>\nEnv: <b>%s</b> (branch: <code>%s</code>)\nSHA: <code>%s</code>","parse_mode":"HTML"}' \
              "${{ secrets.TELEGRAM_CHAT_ID }}" \
              "$ICON" \
              "$STATUS" \
              "$ENV" \
              "$BRANCH" \
              "${GITHUB_SHA:0:7}")"
